    <main>
        <div class="container">

            <div class="card bg-black border-secondary text-light shadow-lg">
                <div class="card-body p-4">

                    <h2 class="text-center mb-4">Avaliação do Portfólio</h2>

                    <form action="https://formspree.io/f/xwvjaynb" method="POST">

                        <!-- Nome -->
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" name="nome" class="form-control bg-dark text-light border-secondary"
                                id="nome" placeholder="Digite seu nome">
                        </div>

                        <!-- E-mail -->
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" name="email" class="form-control bg-dark text-light border-secondary"
                                id="email" placeholder="Digite seu e-mail">
                        </div>

                        <!-- Nota geral -->
                        <div class="mb-3">
                            <label for="nota" class="form-label">Nota geral para o portfólio</label>
                            <select class="form-select bg-dark text-light border-secondary" name="nota" id="nota">
                                <option selected disabled>Selecione uma nota</option>
                                <option>1 - Muito Ruim</option>
                                <option>2 - Ruim</option>
                                <option>3 - Regular</option>
                                <option>4 - Bom</option>
                                <option>5 - Excelente</option>
                            </select>
                        </div>

                        <!-- Aspectos avaliados -->
                        <div class="mb-4">
                            <label class="form-label">O que mais chamou sua atenção?</label>

                            <div class="form-check">
                                <input class="form-check-input" name="atencao" type="checkbox" id="design">
                                <label class="form-check-label" for="design">
                                    Design Gráfico
                                </label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" name="atencao" type="checkbox" id="projetos">
                                <label class="form-check-label" for="projetos">
                                    Projetos apresentados
                                </label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" name="atencao" type="checkbox" id="tecnologias">
                                <label class="form-check-label" for="tecnologias">
                                    Tecnologias utilizadas
                                </label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" name="atencao" type="checkbox" id="organizacao">
                                <label class="form-check-label" for="organizacao">
                                    Organização do conteúdo
                                </label>
                            </div>
                        </div>

                        <!-- Recomendação -->
                        <div class="mb-3">
                            <label class="form-label">Você recomendaria este portfólio?</label>

                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="recomendacao" id="sim">
                                <label class="form-check-label" for="sim">
                                    Sim
                                </label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="recomendacao" id="nao">
                                <label class="form-check-label" for="nao">
                                    Não
                                </label>
                            </div>
                        </div>

                        <!-- Comentários -->
                        <div class="mb-4">
                            <label for="comentarios" class="form-label">Comentários e sugestões</label>
                            <textarea class="form-control bg-dark text-light border-secondary" id="comentarios" rows="5"
                                placeholder="Escreva sua opinião sobre o portfólio"></textarea>
                        </div>

                        <!-- Botões -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn">
                                Enviar Avaliação
                            </button>

                            <button type="reset" class="btn btn-outline-secondary">
                                Limpar
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
